name: verify

# A study about verifiability should be verifiable by a stranger. This runs the
# unit tests, recomputes every ledger hash chain, and proves the site rebuilds from
# the ledgers.
#
# NOTE: the build is deterministic for a FIXED input, but the inputs are live —
# agents keep writing world/ and memory/ between rebuilds, so a "committed site must
# match a fresh rebuild" check would fail whenever an agent has run since the last
# publish. The build step is therefore the check: it must succeed from a clean clone.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: npm test

      - name: Verify ledger hash chains
        run: npm run verify

      - name: Rebuild the site from the ledgers
        run: npm run site
